jdk:
  - openjdk25
install:
  # A plain `mvn install`, as everywhere since 2026-10-06 (umbrella doc 43). This one has NO BotMaker
  # dependency at all. What it ships is text, and the BotMaker versions it writes into a generated pom are
  # archetype requiredProperties substituted at generation time. There is nothing for flatten to bake and
  # nothing to pin.
  - mvn install -DskipTests -Dmaven.javadoc.skip=true -B
