# The archetype integration test: generate the skeleton with these answers and check it comes out.
#
# It GENERATES and stops. Building the result would resolve botmaker-studio-api and botmaker-plugin-toolkit
# from JitPack, which would put a network fetch inside `mvn install` at the umbrella root. What this still
# holds is worth having: the descriptor
# is well-formed, every filtered file's Velocity references resolve, and the packaged directories land under
# the requested package.
#
# To build the generated project too, do it by hand against the local reactor:
#   mvn archetype:generate -B -DarchetypeGroupId=com.github.LiQiyeDev \
#       -DarchetypeArtifactId=botmaker-plugin-archetype -DarchetypeVersion=0.0.0-SNAPSHOT \
#       -DgroupId=com.example -DartifactId=my-plugin \
#       -DstudioApiVersion=0.0.0-SNAPSHOT -DtoolkitVersion=0.0.0-SNAPSHOT
#   cd my-plugin && mvn verify
groupId=com.example
artifactId=example-plugin
version=0.1.0-SNAPSHOT
package=com.example.plugin
pluginId=com.example.plugin
pluginName=Example Plugin
studioApiVersion=v0.3.0
toolkitVersion=v0.2.0
