name: CI

# Three jobs, the same shape as the other BotMaker repos: `build` on every push and PR, `release` and
# `jitpack` on a version tag.
#
# This repository is the example plugin `botmaker plugin new` copies (a maven-archetype until 2026-10-19), so
# `build` compiles and tests it like any plugin: the skeleton a newcomer gets is one that passed here.
# `mvn verify` also zips the `template` artifact botmaker-cli bundles; botmaker-cli's PluginTemplateTest
# renames, compiles, loads and validates that copy.
#
# The parent and the two upstreams it pins are built from source, not resolved from JitPack: each is pinned at
# its main -SNAPSHOT, which nothing publishes. The parent's relativePath names the umbrella's sibling, absent
# here, so Maven finds it in ~/.m2.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out botmaker-studio-api
        uses: actions/checkout@v7
        with:
          repository: BotMakerDev/botmaker-studio-api
          path: .deps/botmaker-studio-api

      - name: Check out botmaker-plugin-toolkit
        uses: actions/checkout@v7
        with:
          repository: BotMakerDev/botmaker-plugin-toolkit
          path: .deps/botmaker-plugin-toolkit

      - name: Check out botmaker-plugin-parent
        uses: actions/checkout@v7
        with:
          repository: BotMakerDev/botmaker-plugin-parent
          path: .deps/botmaker-plugin-parent

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # RETRIED — Maven Central answers 429 to GitHub-hosted runners; see .github/mvn-retry.sh.
      - name: Install the parent and its two upstreams (their main -SNAPSHOT)
        run: |
          source .github/mvn-retry.sh
          mvn_retry mvn -B -f .deps/botmaker-studio-api/pom.xml install -DskipTests
          mvn_retry mvn -B -f .deps/botmaker-plugin-toolkit/pom.xml install -DskipTests
          mvn_retry mvn -B -f .deps/botmaker-plugin-parent/pom.xml install

      - name: Build and test
        run: mvn -B verify

  # The GitHub Release, published by JReleaser from the tag the umbrella's release.sh pushed. It runs HERE
  # and not from the umbrella working copy for the reason recorded in jreleaser.yml: JReleaser's JGit cannot
  # open a submodule, whose `.git` is a file.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The SAME script release.sh calls to gate this release (check_changelog). One extractor, two readers
      # in two repositories: a release whose notes come from a different rule than the one that gated it can
      # pass the gate and then publish something else.
      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p target
          tools/changelog-section.sh "$version" > target/jreleaser-changelog.md
          echo "JRELEASER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish the release
        uses: jreleaser/release-action@v2
        with:
          version: 1.25.0
          arguments: full-release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # JitPack builds the artifact itself from the pushed tag; this just asks it to start eagerly, so the cli's own
  # tag build, which resolves the `template` zip from it, does not wait for it.
  jitpack:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger JitPack build for ${{ github.ref_name }}
        run: |
          curl -sf "https://jitpack.io/api/builds/com.github.${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.ref_name }}" || true
