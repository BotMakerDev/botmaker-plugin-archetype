name: CI

# Three jobs, the same shape as the other BotMaker repos: `build` on every push and PR, `release` and
# `jitpack` on a version tag.
#
# UNLIKE EVERY OTHER MODULE HERE, `build` checks out nothing: this repository has no BotMaker dependency.
# What it ships is text, and the BotMaker versions it writes into a generated pom are archetype
# requiredProperties substituted at generation time.
#
# `mvn verify` runs the archetype's own integration test, which GENERATES the skeleton and stops. It does
# not build what it generates: that would resolve botmaker-studio-api and botmaker-plugin-toolkit at
# whatever `main-SNAPSHOT` currently is, making this job fail whenever somebody else's branch is red. The
# command that does build the skeleton is in README.md and runs against a local reactor, which is where it
# belongs.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and generate
        run: mvn -B verify

  # The GitHub Release, published by JReleaser from the tag the umbrella's release.sh pushed. It runs HERE
  # and not from the umbrella working copy for the reason recorded in jreleaser.yml: JReleaser's JGit cannot
  # open a submodule, whose `.git` is a file.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The SAME script release.sh calls to gate this release (check_changelog). One extractor, two readers
      # in two repositories: a release whose notes come from a different rule than the one that gated it can
      # pass the gate and then publish something else.
      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p target
          tools/changelog-section.sh "$version" > target/jreleaser-changelog.md
          echo "JRELEASER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish the release
        uses: jreleaser/release-action@v2
        with:
          version: 1.25.0
          arguments: full-release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # JitPack builds the artifact itself from the pushed tag; this just asks it to start eagerly, so the first
  # `mvn archetype:generate` against a new tag does not wait for it.
  jitpack:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger JitPack build for ${{ github.ref_name }}
        run: |
          curl -sf "https://jitpack.io/api/builds/com.github.${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.ref_name }}" || true
